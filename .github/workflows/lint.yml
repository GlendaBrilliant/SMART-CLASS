name: Lint and Test Specific Script
on: [push, pull_request]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run lint check on specific script
        run: npx eslint src/script.js
      - name: Run tests on specific script
        run: npx jest tests/script.test.js